[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphene_raman"
version = "0.1.0"
description = "Sous-ensemble du paquet graphene_raman nécessaire aux figures du mémoire (configuration, style, lecture du pseudopotentiel)"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graphene_raman = ["plotting/*.mplstyle"]
